[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sploitmap"
version = "3.0.0"
description = "Reconnaissance, vulnerability-intelligence and manual-exploitation recommendation framework for OSCP-style engagements. Finds and recommends; never exploits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "packaging>=21",
    "rich>=13",
    "jinja2>=3",
    "pyyaml>=6",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sploitmap = "smap.cli:main"

[tool.setuptools]
packages = [
    "smap", "smap.core", "smap.discovery", "smap.fingerprint", "smap.protocols",
    "smap.intelligence", "smap.correlation", "smap.recommendations",
    "smap.policies", "smap.reporting",
]

[tool.setuptools.package-data]
"smap.policies" = ["policy.yaml"]
